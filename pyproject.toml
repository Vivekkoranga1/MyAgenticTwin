[project]
name = "myagentictwin"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vivek", email = "Vivekkoranga01@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.31.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
myagentictwin = "myagentictwin:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
]
